<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>RootPass</title>
  </head>
  <body>
    <header class="head">
      <svg class="brand-logo" viewBox="0 0 128 128" aria-hidden="true">
        <defs>
          <linearGradient id="rp-logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a78c0" />
            <stop offset="1" stop-color="#2a46d6" />
          </linearGradient>
        </defs>
        <circle cx="64" cy="64" r="64" fill="url(#rp-logo-g)" />
        <circle cx="64" cy="36" r="9" fill="#ffffff" />
        <g
          fill="none"
          stroke="#ffffff"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M64 52V94" />
          <path d="M64 66C64 80 44 80 36 96" />
          <path d="M64 66C64 80 84 80 92 96" />
        </g>
      </svg>
      <div class="brand">
        <span class="brand-name">RootPass</span>
        <span id="tagline" class="brand-sub"></span>
      </div>
      <span id="status" class="status" hidden></span>
    </header>

    <main id="body" class="body"></main>

    <section id="prefs" class="prefs" hidden></section>

    <footer class="foot">
      <span class="foot-note">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3Z" />
        </svg>
        <span id="foot-text"></span>
      </span>
      <button id="revoke" class="link" type="button" hidden></button>
    </footer>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
